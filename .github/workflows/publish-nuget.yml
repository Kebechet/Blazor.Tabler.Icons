name: Publish to NuGet

on:
  workflow_dispatch:

env:
  PROJECT_PATH: src/Blazor.Tabler.Icons/Blazor.Tabler.Icons.csproj
  PROJECT_PATH_SVG: src/Blazor.Tabler.Icons.Svg/Blazor.Tabler.Icons.Svg.csproj
  PACKAGE_NAME: Kebechet.Blazor.Tabler.Icons
  PACKAGE_NAME_SVG: Kebechet.Blazor.Tabler.Icons.Svg
  BUILD_CONFIGURATION: Release
  OUTPUT_PATH: ./nupkg
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  # nuget.org profile name (not the email) that owns the trusted publishing policy
  NUGET_USER: Kebechet

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PROJECT_PATH }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get SVG version from csproj
        id: version_svg
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PROJECT_PATH_SVG }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "SVG version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ${{ env.OUTPUT_PATH }}

      - name: Build SVG
        run: dotnet build ${{ env.PROJECT_PATH_SVG }} --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Pack SVG
        run: dotnet pack ${{ env.PROJECT_PATH_SVG }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ${{ env.OUTPUT_PATH }}

      # Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): nuget.org
      # trades this job's GitHub OIDC token for an API key that expires after an hour, so the login sits
      # right before the push. The nuget.org policy names this repository and the file name
      # publish-nuget.yml - renaming this file stops publishing until the policy is updated to match.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ${{ env.OUTPUT_PATH }}/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source ${{ env.NUGET_SOURCE }} --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push ${{ env.OUTPUT_PATH }}/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

      - name: Create GitHub Release (font)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## ${{ env.PACKAGE_NAME }} v${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            dotnet add package ${{ env.PACKAGE_NAME }} --version ${{ steps.version.outputs.version }}
            ```

            ### Links
            - [NuGet Package](https://www.nuget.org/packages/${{ env.PACKAGE_NAME }}/${{ steps.version.outputs.version }})
            - [Tabler Icons](https://tabler.io/icons)
          files: ${{ env.OUTPUT_PATH }}/${{ env.PACKAGE_NAME }}.${{ steps.version.outputs.version }}.nupkg
          generate_release_notes: true

      - name: Create GitHub Release (SVG)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_svg.outputs.version }}-svg
          name: v${{ steps.version_svg.outputs.version }}-svg
          body: |
            ## ${{ env.PACKAGE_NAME_SVG }} v${{ steps.version_svg.outputs.version }}

            Inline SVG backend for Tabler Icons with build-time tree-shaking.

            ### Installation
            ```bash
            dotnet add package ${{ env.PACKAGE_NAME_SVG }} --version ${{ steps.version_svg.outputs.version }}
            ```

            ### Links
            - [NuGet Package](https://www.nuget.org/packages/${{ env.PACKAGE_NAME_SVG }}/${{ steps.version_svg.outputs.version }})
            - [Tabler Icons](https://tabler.io/icons)
          files: ${{ env.OUTPUT_PATH }}/${{ env.PACKAGE_NAME_SVG }}.${{ steps.version_svg.outputs.version }}.nupkg
          generate_release_notes: true
